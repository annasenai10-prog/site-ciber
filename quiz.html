<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz | CyberGuard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">CYBER<span>GUARD</span></div>
    <nav>
        <a href="index.html">Início</a>
        <a href="index.html#ataques">Ataques</a>
    </nav>
</header>

<main class="quiz-page">
    <div class="quiz-box">
        <p class="tag">DESAFIO CYBERGUARD</p>
        <h1>Teste seus conhecimentos</h1>
        <p>Escolha a alternativa correta entre A e E.</p>

        <div class="quiz-progress">
            <div id="progress-bar"></div>
        </div>

        <div class="quiz-info">
            <span id="question-number"></span>
            <span id="score">Pontos: 0</span>
        </div>

        <h2 id="question"></h2>

        <div id="answers" class="answers"></div>

        <p id="feedback"></p>

        <button id="next-button" class="btn" hidden>
            Próxima pergunta
        </button>

        <div id="result" hidden>
            <h2>Quiz concluído!</h2>
            <p id="final-score"></p>
            <p id="final-message"></p>
            <button id="restart-button" class="btn">
                Refazer quiz
            </button>
        </div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
